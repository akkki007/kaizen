[project]
name = "causaldeploy"
version = "0.1.0"
description = "Graph-based root-cause analysis and verified remediation for failed deployments"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "falkordb>=1.0",
  "openai>=1.54",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.1.4",
  "asyncpg>=0.32.0",
  "alembic>=1.20.0",
  "arq>=0.28.0",
  "pyjwt[crypto]>=2.15.1",
  "tree-sitter>=0.26.0",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter-typescript>=0.23.2",
  "prometheus-client>=0.26.0",
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
  "opentelemetry-instrumentation-fastapi>=0.66b1",
  "mcp>=2.3.0",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest-cov>=7.1.0",
  "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causaldeploy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501", "I001", "UP"]
"tests/**" = ["E501", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
