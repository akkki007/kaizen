name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core } }
    services:
      falkordb:
        image: falkordb/falkordb:6.0.2
        ports: ["6380:6379"]
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: causaldeploy, POSTGRES_PASSWORD: causaldeploy, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U causaldeploy" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy src
      # includes: migration up/down + drift, contract/OpenAPI freshness, auth, jobs, graph, ingest
      - run: uv run pytest
      - name: Contract change requires a version bump
        if: github.event_name == 'pull_request'
        run: uv run python -m causaldeploy.cli check-contract-version --base origin/${{ github.base_ref }}

  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-restore.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t causaldeploy-core:ci core
      - run: docker build -t causaldeploy-ui:ci ui
      # container scans: report fixable HIGH/CRITICAL OS or library vulnerabilities. Report-only
      # until a first clean CI run; then set exit-code to "1" to gate merges (docs/security.md)
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: causaldeploy-core:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: causaldeploy-ui:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # secrets anywhere in history (keys, tokens, the GitHub App PEM)
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner
      - uses: astral-sh/setup-uv@v7
      - name: Python dependency audit (pip-audit)
        working-directory: core
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit==2.7.3 --strict -r /tmp/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm audit (runtime dependencies)
        working-directory: ui
        run: npm install --ignore-scripts && npm audit --omit=dev --audit-level=high

  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Generated API client is current (no manual edits)
        run: npm run gen:api && git diff --exit-code lib/api
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
        env:
          NEXT_PUBLIC_API_MOCK: "1"
