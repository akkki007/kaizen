name: deploy
on:
  push: { branches: [main, feat/m1-foundations] }
  workflow_dispatch:
concurrency: { group: deploy-prod, cancel-in-progress: false }
permissions:
  id-token: write   # OIDC -> AWS, no stored keys
  contents: read
  packages: write
jobs:
  deploy:
    # Repository variables: DEPLOY_ENABLED=true, AWS_DEPLOY_ROLE_ARN, DEPLOY_INSTANCE_ID, PUBLIC_DOMAIN
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/causaldeploy-core:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - run: |
          img="${IMAGE,,}"
          docker build -t "$img" core && docker push "$img"
          echo "IMAGE_LC=$img" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy on the host
        env: { GHCR_TOKEN: "${{ github.token }}" }
        run: |
          {
            echo 'set -euo pipefail'
            echo 'mkdir -p /opt/causaldeploy && cd /opt/causaldeploy'
            for f in docker-compose.prod.yml Caddyfile deploy.sh; do
              echo "base64 -d > $f <<'B64'"; base64 -w0 "deploy/$f"; echo; echo B64
            done
            echo 'chmod +x deploy.sh'
            echo "echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
            echo "./deploy.sh '$IMAGE_LC' 2>&1 | tail -n 60"
          } > remote.sh
          ./deploy/ssm-run.sh "${{ vars.DEPLOY_INSTANCE_ID }}" remote.sh
      - name: Smoke test
        run: |
          for i in $(seq 1 40); do
            curl -fsS "https://${{ vars.PUBLIC_DOMAIN }}/readyz" && exit 0; sleep 6
          done; exit 1
